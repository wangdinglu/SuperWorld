name: Publish web client to GitHub Pages

# Builds the web client and publishes it to the gh-pages branch, which GitHub Pages serves at
# https://<owner>.github.io/<repo>/. Without a game server it runs in solo practice mode.
# To connect it to a game server (e.g. on Render), set the repository variable SERVER_URL
# (Settings → Secrets and variables → Actions → Variables), or open the page with ?server=<url>.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Never replace the working site with a broken build: run every check first.
      - run: pnpm check
      - run: pnpm --filter @superworld/web build
        env:
          VITE_SERVER_URL: ${{ vars.SERVER_URL }}
      - name: Push to gh-pages
        run: |
          cd apps/web/dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish web client from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
