# Render Blueprint: one free web service that runs the game server and serves the web client.
# Render → New → Blueprint → pick this repo. The free plan sleeps after 15 minutes without visitors.
services:
  - type: web
    name: superworld
    runtime: node
    plan: free
    branch: master
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: GUEST_TOKEN_SECRET
        generateValue: true
      # Comma-separated origins allowed to call the API, e.g. your Cloudflare Pages URL. Empty = any origin.
      - key: ALLOWED_ORIGINS
        value: ""
      # Postgres connection string (e.g. Neon's free tier). Without it, accounts live in an embedded
      # database on the server's disk, which resets when a free Render service restarts.
      - key: DATABASE_URL
        sync: false
      # Where emailed sign-in links point: your game's public address (e.g. the GitHub Pages URL).
      - key: PUBLIC_URL
        sync: false
      # Resend API key for sign-in emails. Without it, links are printed to the server log.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
